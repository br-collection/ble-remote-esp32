; BLE-Remote – ESP32-Gegenstelle für das Garmin-Widget
;
; Board: ESP32-C3 Development Board mit 1,3"-OLED (SH1106, I2C), Keramikantenne,
; USB-C direkt am C3 (kein USB-UART-Chip). Taster BO0 = GPIO9.
; Das OLED zeigt Verbindung und empfangene Befehle, siehe src/diag.cpp.

[env:esp32c3-oled]
platform = espressif32 @ 6.12.0   ; fest: Arduino-Core 2.0.17
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_flags =
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    h2zero/NimBLE-Arduino@^2.1.0
    olikraus/U8g2@^2.35.0
