; BLE Remote - ESP32 counterpart for the Garmin widget
;
; Board: ESP32-C3 development board with 1.3" OLED (SH1106, I2C), ceramic antenna,
; USB-C directly at the C3 (no USB-UART chip). Button BO0 = GPIO9.
; The OLED shows the connection and received commands, see src/diag.cpp.

[env:esp32c3-oled]
platform = espressif32 @ 6.12.0   ; pinned: Arduino core 2.0.17
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_flags =
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    h2zero/NimBLE-Arduino@^2.1.0
    olikraus/U8g2@^2.35.0
